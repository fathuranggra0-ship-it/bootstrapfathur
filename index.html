<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CV Saya</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <nav class="navbar navbar-expand-lg bg-primary" data-bs-theme="dark">
    <div class="container">
        <a class="navbar-brand" href="#">Profile</a>

        <button class="navbar-toggler" type="button"
            data-bs-toggle="collapse" data-bs-target="#menu">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menu">
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="#home">Home</a>
                <a class="nav-link" href="#pelajaran">Menu</a>
                <a class="nav-link" href="#about">About</a>
                <a class="nav-link" href="#kontak">Kontak</a>
            </div>
        </div>
    </div>
</nav>
    
<header id="home" class="container mt-4">

    <div id="carouselFoto" class="carousel slide" data-bs-ride="carousel">

        <div class="carousel-indicators">
            <button type="button" data-bs-target="#carouselFoto"
                data-bs-slide-to="0" class="active"></button>
            <button type="button" data-bs-target="#carouselFoto"
                data-bs-slide-to="1"></button>
            <button type="button" data-bs-target="#carouselFoto"
                data-bs-slide-to="2"></button>
        </div>

        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="Ak1.jpg" class="d-block w-100"
                    height="300" alt="Foto pertama">
            </div>

            <div class="carousel-item">
                <img src="Ak2.jpg" class="d-block w-100"
                    height="300" alt="Foto kedua">
            </div>

            <div class="carousel-item">
                <img src="Ak3.jpg" class="d-block w-100"
                    height="300" alt="Foto ketiga">
            </div>
        </div>

        <button class="carousel-control-prev" type="button"
            data-bs-target="#carouselFoto" data-bs-slide="prev">
            <span class="carousel-control-prev-icon"></span>
        </button>

        <button class="carousel-control-next" type="button"
            data-bs-target="#carouselFoto" data-bs-slide="next">
            <span class="carousel-control-next-icon"></span>
        </button>

    </div>

</header>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
